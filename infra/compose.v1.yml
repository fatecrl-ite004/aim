name: aim-v1

services:
  postgres:
    # Snapshot oficial ja presente no host e validado na execucao da V1 (18.1).
    image: postgres@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    container_name: aim-v1-postgres
    environment:
      POSTGRES_DB: aim
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: ${AIM_POSTGRES_PASSWORD:?Defina AIM_POSTGRES_PASSWORD em .env.v1}
    ports:
      - "127.0.0.1:${AIM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - aim-v1-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim -d aim"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  aim-v1-pgdata:
    name: aim-v1-pgdata
