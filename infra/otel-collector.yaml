receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp_http/aim:
    metrics_endpoint: http://api:8000/v1/metrics
    encoding: proto
    compression: none
    timeout: 60s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/aim]
